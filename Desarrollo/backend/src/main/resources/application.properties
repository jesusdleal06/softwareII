spring.application.name=villadent-agendapro

# Datasource. The defaults point at the dev database from
# Desarrollo/backend/docker-compose.yml (host port 5434, not the default 5432,
# because other local projects already publish that port).
# Override with DB_URL, DB_USER and DB_PASSWORD for any other environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/villadent}
spring.datasource.username=${DB_USER:villadent}
spring.datasource.password=${DB_PASSWORD:villadent}

# The schema belongs to the Flyway migrations in db/migration; Hibernate must
# never create or alter tables. Startup fails on purpose as soon as an entity
# exists without its matching migration.
spring.jpa.hibernate.ddl-auto=validate

# Do not hold a database connection open for the whole request.
spring.jpa.open-in-view=false

# Actuator: expose only the health endpoint for the Render health check.
management.endpoints.web.exposure.include=health

# The application enforces a 5 MiB photo limit with a user-facing validation error.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

app.cloudinary.cloud-name=${APP_CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${APP_CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${APP_CLOUDINARY_API_SECRET:}

# Meta WhatsApp authentication template used to deliver the phone verification code.
# It must be approved in the Meta console before public booking can verify phones.
app.whatsapp.verification-template-name=${APP_WHATSAPP_VERIFICATION_TEMPLATE_NAME:}

# Header that carries the real client address when the API runs behind a reverse proxy.
# Empty means the connection address (HttpServletRequest#getRemoteAddr()) is used.
app.verification.client-ip-header=${APP_VERIFICATION_CLIENT_IP_HEADER:}
