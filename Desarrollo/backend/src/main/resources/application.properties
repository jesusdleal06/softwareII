spring.application.name=villadent-agendapro

# Datasource. The defaults point at the dev database from
# Desarrollo/backend/docker-compose.yml (host port 5434, not the default 5432,
# because other local projects already publish that port).
# Override with DB_URL, DB_USER and DB_PASSWORD for any other environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/villadent}
spring.datasource.username=${DB_USER:villadent}
spring.datasource.password=${DB_PASSWORD:villadent}

# The schema belongs to the Flyway migrations in db/migration; Hibernate must
# never create or alter tables. With no entities and no migrations yet this is
# a no-op, and it starts failing on purpose as soon as an entity exists without
# its matching migration.
spring.jpa.hibernate.ddl-auto=validate

# Do not hold a database connection open for the whole request.
spring.jpa.open-in-view=false

# Actuator: expose only the health endpoint for the Render health check.
management.endpoints.web.exposure.include=health
