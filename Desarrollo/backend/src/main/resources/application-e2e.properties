# Local test support only. Never activate this profile in production.
app.manage-link-base=http://localhost:4291/cita/
app.cors.allowed-origin=http://localhost:4291
# The E2E suite books many times from one IP in a few minutes, so relax the per-hour
# request limits here; production keeps the defaults (3 per phone, 10 per IP).
app.verification.max-codes-per-phone-per-hour=1000
app.verification.max-codes-per-ip-per-hour=1000
