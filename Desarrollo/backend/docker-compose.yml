# Dev-only PostgreSQL for the Villadent backend.
# Host port 5434 because 5432 and 5433 are already taken by other local
# projects; inside the container it still listens on the default 5432.
services:
  postgres:
    # Same major as the tests (see TestcontainersConfiguration): a moving
    # `latest` would let dev and test databases drift apart.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: villadent
      POSTGRES_USER: villadent
      # Throwaway local credentials. Real environments pass their own values
      # through DB_URL / DB_USER / DB_PASSWORD (see README).
      POSTGRES_PASSWORD: villadent
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Makes `docker compose up -d --wait` block until queries are served.
      test: ["CMD-SHELL", "pg_isready -U villadent -d villadent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
