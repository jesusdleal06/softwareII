<!doctype html>
<html lang="es" class="bg-background">
<head>
  <meta charset="utf-8">
  <title>Villadent AgendaPro</title>
  <meta name="description" content="Agenda tu cita odontológica en el Centro Odontológico Villadent y recibe recordatorios por WhatsApp.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f171c" media="(prefers-color-scheme: dark)">
  <script>
    // Applies the dark theme before first paint so there is no flash of the wrong theme.
    // The class is the single source of truth: `dark:` utilities resolve from it.
    (function () {
      try {
        var stored = window.localStorage.getItem('villadent-theme');
        var preference = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function (dark) {
          document.documentElement.classList.toggle('dark', dark);
        };
        apply(stored === 'dark' || stored === 'light' ? stored === 'dark' : preference.matches);
        preference.addEventListener('change', function (event) {
          if (!window.localStorage.getItem('villadent-theme')) apply(event.matches);
        });
      } catch (error) {
        // Storage blocked (private mode): the light default in styles.css stands.
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body class="antialiased min-h-dvh flex flex-col">
  <app-root></app-root>
</body>
</html>
